<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Isabella</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Caveat:wght@500;600&display=swap">
<style>
:root{--ink:#1d1424;--ink2:#2b1d33;--coral:#e9573a;--gold:#e8b649;--pine:#1f4a3b;--paper:#f7ede2;--text:#f3e6da;--muted:#b9a5b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:'Fraunces',Georgia,serif;overflow:hidden;
background-image:radial-gradient(60% 40% at 20% 0%,rgba(233,87,58,.22),transparent 70%),radial-gradient(50% 40% at 90% 100%,rgba(232,182,73,.14),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .6s,transform .6s}
.screen.hide{opacity:0;transform:scale(.96);visibility:hidden;transition:opacity .6s,transform .6s,visibility 0s .6s}
.screen.hide,.screen.hide *{pointer-events:none!important}
/* intro */
#intro h1{font-weight:600;font-size:clamp(3rem,15vw,5.5rem);line-height:1;margin:28px 0 10px;letter-spacing:-.02em}
#intro p{margin:0 0 30px;color:var(--muted);font-size:1.15rem;font-style:italic;max-width:26ch;line-height:1.45}
.fan{position:relative;width:170px;height:230px}
.fan i{position:absolute;inset:0;border-radius:16px;background-size:cover;background-position:center;border:6px solid var(--paper);box-shadow:0 14px 30px rgba(0,0,0,.45);transform-origin:50% 120%;animation:fan 1.4s .2s cubic-bezier(.2,.9,.25,1) both}
.fan i:nth-child(1){--r:-16deg}.fan i:nth-child(2){--r:-5deg;animation-delay:.35s}.fan i:nth-child(3){--r:7deg;animation-delay:.5s}.fan i:nth-child(4){--r:18deg;animation-delay:.65s}
@keyframes fan{from{transform:rotate(0) translateY(10px);opacity:0}to{transform:rotate(var(--r))}}
.fan i{transform:rotate(var(--r))}
.btn{background:var(--coral);border:0;border-radius:999px;padding:15px 34px;font-size:1.1rem;font-weight:600;color:#fff;box-shadow:0 8px 22px rgba(233,87,58,.4);transition:transform .2s}
.btn:active{transform:scale(.96)}
/* deck */
#deckScreen{justify-content:space-between;padding:20px 16px 18px}
#hint{margin:6px 0 0;color:var(--muted);font-style:italic;font-size:.98rem}
#deck{position:relative;width:min(78vw,340px);aspect-ratio:5/7.8;max-height:68vh;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;perspective:1200px;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s;cursor:grab}
.card.drag{transition:none;cursor:grabbing}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.front{background:var(--c);padding:14px;display:flex;flex-direction:column;color:#fff}
.idx{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:1.05rem;padding:0 6px 8px}
.idx span:last-child{transform:rotate(180deg)}
.arch{flex:1;border-radius:999px 999px 14px 14px;background-size:cover;background-position:center 30%;border:4px solid rgba(255,255,255,.9);min-height:0}
.front .cap{text-align:center;padding:12px 6px 4px;min-height:3.4rem;display:flex;align-items:center;justify-content:center}
.front .cap b{font-weight:600;font-size:1.2rem;line-height:1.2}
.back{transform:rotateY(180deg);background:var(--paper);color:#3a2a36;padding:20px 18px 16px;display:flex;flex-direction:column;border:8px solid var(--c)}
.back .msg{flex:1;overflow-y:auto;font-family:'Caveat',cursive;font-weight:500;font-size:1.65rem;line-height:1.3;white-space:pre-line;
background-image:repeating-linear-gradient(transparent 0 calc(1.3em - 1px),rgba(58,42,54,.14) calc(1.3em - 1px) 1.3em)}
.back .from{margin-top:12px;text-align:right;font-style:italic;font-size:1.05rem}
.back .from b{font-style:normal;font-weight:600;color:var(--c)}
.back .dot{position:absolute;left:50%;top:9px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--c);opacity:.7}
.nav{display:flex;align-items:center;gap:22px;color:var(--muted)}
.nav button{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(243,230,218,.35);background:transparent;font-size:1.4rem;transition:background .2s,opacity .2s}
.nav button:disabled{opacity:.25;cursor:default}
.nav button:not(:disabled):active{background:rgba(243,230,218,.15)}
  .bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.ghost{background:transparent;border:0;color:var(--muted);font-size:.98rem;padding:8px 14px;text-decoration:underline;text-underline-offset:4px}
#count{min-width:6ch;font-size:1rem}
.msg.scroll{-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.msg.scroll.end{-webkit-mask-image:none;mask-image:none}
.more{display:none;text-align:center;font-size:.8rem;color:#8a7684;font-style:italic;margin-top:4px}
.msg.scroll:not(.end)+.more{display:block}
#floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#floaters span{position:absolute;opacity:0;animation-name:pop,bob;animation-timing-function:ease-out,ease-in-out;animation-iteration-count:1,infinite;animation-fill-mode:both,none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@keyframes pop{from{opacity:0;scale:0}to{opacity:.92;scale:1}}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--dx),-28px) rotate(var(--rot))}}
#intro>:not(#floaters){position:relative;z-index:1}
.imgback{padding:10px 10px 12px}.imgback img{display:block;width:100%;height:auto;margin:auto 0;border-radius:6px}
.imgback .from{margin-top:8px}.imgback .from b{color:#2b1d33}.imgback .dot{display:none}
@media (prefers-reduced-motion:reduce){#floaters span{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<section id="intro" class="screen">
  <div class="fan" id="fan"></div>
  <h1>Isabella</h1>
  <p>Esto es lo que pensamos quienes más te amamos</p>
  <button class="btn" id="open">Abrir la baraja</button>
</section>

<section id="deckScreen" class="screen hide" aria-hidden="true">
  <p id="hint">Toca una carta para leerla. Desliza para pasar a la siguiente.</p>
  <div id="deck" aria-live="polite"></div>
  <div class="bottom">
    <div class="nav">
      <button id="prev" aria-label="Carta anterior">&#8592;</button>
      <span id="count"></span>
      <button id="next" aria-label="Carta siguiente">&#8594;</button>
    </div>
    <button id="home" class="ghost">&#8634; Volver al inicio</button>
  </div>
</section>

  {title:"De quien estaría dispuesto a todo por ti 💙", color:"#2f5fb3", msg:"Mi amor, mi vida, mi cielo:\n\nNo te diré aquí nada que no te haya expresado antes. Y, aunque debo confesarte que a veces tengo miedo de expresarte todo lo que siento, por temor a que pueda asustarte, al final lo que siento por ti es mucho más fuerte que ese miedo, y siempre termino, de una u otra manera, dejándote ver todo este amor que llevo dentro.\n\nY es precisamente ese miedo el que, de alguna manera, me hace sentir vivo. Porque me hace saber que estoy arriesgándome, que estoy entregándome sin límites a la persona con la que quiero compartir mi vida y que, en el fondo de mi corazón, deseo que sea mi amor para toda la vida. Justamente por eso, quiero saber\n\n¿Te gustaría dar conmigo el primer paso de nuestra historia juntos y dejarme convertirme en tu novio?"}
];

const $ = s => document.querySelector(s);
const deck = $('#deck'), N = CARDS.length;
let idx = 0, els = [];

function makeFloaters(){const F=['🌈','❤️','⭐','✨','🩷','💛','☁️','🌸','🦋','💜','💚','🧡','🌟','🌈'],fl=document.createElement('div');fl.id='floaters';fl.setAttribute('aria-hidden','true');const r=Math.random;
for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=F[i%F.length];
s.style.cssText=`left:${(r()*92).toFixed(1)}%;top:${(r()*90).toFixed(1)}%;font-size:${(16+r()*26).toFixed(0)}px;--dx:${(r()*44-22).toFixed(0)}px;--rot:${(r()*36-18).toFixed(0)}deg;animation-delay:${(r()*2).toFixed(2)}s,${(r()*3).toFixed(2)}s;animation-duration:.9s,${(6+r()*7).toFixed(1)}s`;fl.appendChild(s);}
const old=document.getElementById('floaters'); if(old) old.remove(); document.querySelector('#intro').prepend(fl);}
makeFloaters();
const buildFan = () => { $('#fan').innerHTML = [PHOTOS[3],PHOTOS[6],PHOTOS[2],PHOTOS[0]].map(p => `<i style="background-image:url(${p})"></i>`).join(''); };
buildFan();

CARDS.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'card';
  el.style.setProperty('--c', c.color);
  const sym = ['♥','✦','♦','✿'][i % 4];
  el.innerHTML = `<div class="inner">
    <div class="face front"><div class="idx"><span>${i+1} ${sym}</span><span>${i+1} ${sym}</span></div>
      <div class="arch" style="background-image:url(${PHOTOS[i % PHOTOS.length]})"></div>
      <div class="cap"><b>${c.title}</b></div></div>
    <div class="face back${c.img?' imgback':''}"${c.img?` style="background:${c.paper}"`:''}><span class="dot"></span>${c.img?`<img src="${c.img}" alt="Mensaje escrito a mano">`:'<div class="msg"></div><div class="more">↓ desliza para seguir leyendo</div>'}
      <div class="from"><b></b></div></div></div>`;
  if (!c.img) el.querySelector('.msg').textContent = c.msg;
  el.querySelector('.from b').textContent = c.title;
  deck.appendChild(el); els.push(el);
});

function fit(){document.querySelectorAll('.msg').forEach(m=>{let s=30;m.style.fontSize=s+'px';while(m.scrollHeight>m.clientHeight+1&&s>16){s--;m.style.fontSize=s+'px';}m.classList.toggle('scroll',m.scrollHeight>m.clientHeight+1);m.classList.remove('end');m.onscroll=()=>m.classList.toggle('end',m.scrollTop+m.clientHeight>=m.scrollHeight-4);});}
fit(); addEventListener('resize',fit); if(document.fonts) document.fonts.ready.then(fit);
function place(){
  els.forEach((el, i) => {
    const d = i - idx;
    if (d < 0){ el.style.transform = 'translateX(-135%) rotate(-20deg)'; el.style.opacity = 0; }
    else if (d > 3){ el.style.transform = 'scale(.85)'; el.style.opacity = 0; }
    else { el.style.transform = `translateY(${d*12}px) scale(${1-d*.045}) rotate(${d ? (d%2?1:-1)*d*1.8 : 0}deg)`; el.style.opacity = 1; }
    el.style.zIndex = 100 - Math.abs(d);
    el.style.pointerEvents = d === 0 ? 'auto' : 'none';
    el.setAttribute('aria-hidden', d !== 0);
    if (d !== 0) el.classList.remove('flipped');
  });
  $('#count').textContent = `${idx+1} de ${N}`;
  $('#prev').disabled = idx === 0; $('#next').disabled = idx === N-1;
}
const go = n => { idx = Math.max(0, Math.min(N-1, n)); place(); };
$('#prev').onclick = () => go(idx-1);
$('#next').onclick = () => go(idx+1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx+1);
  if (e.key === 'ArrowLeft') go(idx-1);
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body) els[idx].classList.toggle('flipped');
});

/* arrastrar / tocar */
let sx = 0, dx = 0, down = false;
deck.addEventListener('pointerdown', e => { if (e.target.closest('.msg') && els[idx].classList.contains('flipped') && e.pointerType==='mouse') return; down = true; sx = e.clientX; dx = 0; els[idx].classList.add('drag'); deck.setPointerCapture(e.pointerId); });
deck.addEventListener('pointermove', e => { if (!down) return; dx = e.clientX - sx; els[idx].style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`; });
const end = () => {
  if (!down) return; down = false;
  const c = els[idx]; c.classList.remove('drag');
  if (dx < -60) go(idx+1);
  else if (dx > 60) go(idx-1);
  else { place(); if (Math.abs(dx) < 8) c.classList.toggle('flipped'); }
};
deck.addEventListener('pointerup', end);
deck.addEventListener('pointercancel', () => { down = false; els[idx].classList.remove('drag'); place(); });

$('#open').onclick = () => {
  $('#intro').classList.add('hide');
  const s = $('#deckScreen'); s.classList.remove('hide'); s.removeAttribute('aria-hidden');
};
$('#home').onclick = () => {
  const s = $('#deckScreen'); s.classList.add('hide'); s.setAttribute('aria-hidden','true');
  $('#intro').classList.remove('hide'); buildFan(); makeFloaters();
  setTimeout(() => { els.forEach(e => e.classList.remove('flipped')); go(0); }, 650);
};
place();
</script>
